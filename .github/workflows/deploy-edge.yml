name: Deploy Edge Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_support.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'pyproject.toml'
      - 'scripts/build-pages.sh'
      - 'scripts/deploy-worker.sh'
      - 'scripts/smoke-test.mjs'
      # Nyt 19-08-2026: Playwright-installationen er flyttet hertil, og en
      # aendring i den skal kunne proeves af med det samme.
      - 'scripts/install-playwright-ci.sh'
      - 'scripts/warm-edge-cache.mjs'
      # Gaten der stopper deployet hvis 2026-07-19-aarsagen genindfoeres.
      - 'scripts/test-security-logging.py'
      # _routes.json og uv.lock indgaar i bundtet/oploesningen af afhaengigheder.
      # Uden dem her kunne en aendring i dem ligge udeployeret uden at nogen saa det.
      - '_routes.json'
      - 'uv.lock'
      - '.github/workflows/deploy-edge.yml'

# Uden en concurrency-gruppe kunne to hurtige pushes deploye parallelt, og det
# AELDRE build kunne naa cache_version-bump + CDN-purge SIDST - dvs. gammel kode
# serveret som "frisk". Vaerre: et main-push der roerer app_support.py trigger
# BAADE dette workflow OG cache-updater (med FORCE_RESEED=1), saa D1-tabelswap,
# to cache_version-bump og en purge kunne ske samtidigt i vilkaarlig raekkefoelge
# - praecis "samtidige cold renders efter reseed", opskriften bag nedbruddet
# 2026-07-19.
#
# Derfor deler dette workflow gruppe med cache-updater.yml (som saetter samme
# navn for main/produktion). Konsekvens: en hotfix-deploy under nattens seed
# venter til seeden er faerdig (op til ~1 t). Det er bevidst - en deploy midt i
# en tabelswap er den dyreste af de to fejl.
#
# cancel-in-progress: false, fordi en afbrudt deploy kan naa `wrangler deploy`
# men ikke cache_version-bumpet og dermed efterlade ny kode med gammel
# cache-noegle. Koerslerne serialiseres i stedet, saa den nyeste vinder til sidst.
concurrency:
  group: madshopper-edge-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # FAIL-SAFE: workflow_dispatch lader en vaelge en vilkaarlig branch i
      # dropdownen. Uden denne guard deployes fx dev-branchens kode til
      # PRODUKTIONENS worker - med prod-KV, prod-D1 og madshopper.dk-routes.
      # Staar foerst, saa intet naar at blive bygget.
      - name: Kraev main-branch (produktion)
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dette workflow deployer til PRODUKTION og maa kun koere fra main (fik '$REF'). Brug 'Deploy Edge Worker (staging)' til andre branches."
            exit 1
          fi
          echo "Ref OK: $REF"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Edge bundle
        env:
          # Uden denne genererer build-pages.sh en tilfældig secret ved hvert
          # deploy, så den deployede worker aldrig matcher GitHub-secret'en som
          # cache-updater bruger til /api/refresh-cache (→ 401 → workflow fejler).
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: bash scripts/build-pages.sh

      # De to invarianter der holder aarsagen til nedbruddet 2026-07-19 nede:
      #   1) sikkerhedslogningen maa aldrig skalere med trafikken (500
      #      haendelser = EN D1-skrivning), og der maa ikke findes en NY
      #      logningssti uden om aggregatoren,
      #   2) [observability] skal vaere eksplicit slaaet fra i alle tre
      #      underafsnit i den wrangler.toml der FAKTISK deployes.
      #
      # Koeres EFTER build (og foer deploy), fordi punkt 2 kun kan verificeres
      # paa det genererede dist/wrangler.toml. REQUIRE_DIST=1 goer en manglende
      # dist/ til en fejl, saa tjekket ikke kan degradere lydloest.
      - name: Test sikkerhedslogning + observability-gate
        env:
          REQUIRE_DIST: "1"
        run: python3 scripts/test-security-logging.py

      # Ændres styles.css/script.js/auth.js uden at ?v= hæves i base.html,
      # bliver den GAMLE fil ved med at køre hos alle besøgende (assets
      # serveres immutable). Det brød login for alle én gang (c7c0efd) og er
      # glemt to gange siden. En regel i CLAUDE.md holder tydeligvis ikke -
      # her er den en gate.
      - name: Test cache-bust af statiske assets
        run: python3 scripts/test-cache-bust.py "${{ github.event.before || 'HEAD~1' }}"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: deploy
          workingDirectory: dist

      - name: Nulstil edge-cache (cache_version)
        working-directory: dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler 4 default'er til lokal KV - uden --remote bumpes
          # cache_version aldrig i Cloudflare, så edge-cachen invalideres ikke.
          npx --yes wrangler@4.114.0 kv key put cache_version "$(date +%s)" \
            --namespace-id 0e60bdf03ed4490cbfac5fa72c8adca5 \
            --remote

      - name: Sæt Browser Cache TTL (Respect Existing Headers)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID ikke sat - springer over"
            exit 0
          fi
          # 0 = Respect Existing Headers. Ellers overskriver zonen HTML max-age
          # til 4 timer, så gamle ?v=-assets hænger efter deploy.
          # || echo 000: uden det draeber en ren netvaerksfejl steppet FOER
          # statuskode-testen (set -e), og continue-on-error skjuler at det
          # overhovedet skete. De sidste 3 tegn tages, fordi curl selv skriver
          # "000" ved forbindelsesfejl oveni vores echo.
          code=$(curl -sS -o /tmp/bcttl.json -w '%{http_code}' -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/settings/browser_cache_ttl" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"value":0}' || echo 000)
          code="${code: -3}"
          echo "Browser Cache TTL HTTP ${code}"
          cat /tmp/bcttl.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Browser Cache TTL kunne ikke saettes (HTTP ${code}). Zonen kan overskrive max-age=0 til 4 timer, saa gamle ?v=-assets haenger efter deploy."
            exit 1
          fi

      - name: Purge CDN-cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID ikke sat - springer CDN-purge over"
            exit 0
          fi
          code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "CDN purge HTTP ${code}"
          cat /tmp/purge.json
          test "$code" = "200"

      # cache_version-bump + CDN-purge gør ALLE sider kolde. Der er IKKE et
      # opvarmningstrin her længere: målt (2026-08-03) at det fejlede 14/14
      # ved gentagne deploys - Cloudflares gratis Bot Fight Mode blokerer ALT
      # fra GitHub Actions-IP'er ubetinget (se kommentaren ved røgtesten
      # nedenfor - bekræftet mod Cloudflares egen dokumentation at ingen
      # WAF-regel kan skippe det). continue-on-error skjulte fejlen i over en
      # uge og forklarer de tilbagevendende 1101-nedbrud. Opvarmning sker nu
      # server-side i src/worker.py (_queue_background_warm) - Workeren
      # varmer sig selv via interne kald, der aldrig rammer Cloudflares edge
      # og derfor aldrig kan Bot Fight-blokeres.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 18-08-2026: dette trin haengte to gange i traek i PRAECIS 30 minutter
      # (jobbets fulde timeout) paa noejagtig samme sted - apt-get update
      # fastlaast under hentning af Ubuntus noble-security-pakkelister, en
      # kendt, tilbagevendende GitHub Actions-runner-svaghed. Uden sit eget
      # kortere timeout brugte ÉT haengt forsoeg hele jobbets tidsbudget og
      # blokerede deployet fra overhovedet at naa Cloudflare-uploadet.
      # 3 forsoeg med et hardt 4-minutters loft pr. forsoeg (via `timeout`,
      # som rent faktisk draeber processen - i modsaetning til
      # step-niveau timeout-minutes, der kun stopper NAAR trinnet slutter).
      - name: Install Playwright (Chromium)
        timeout-minutes: 15
        # Logikken ligger i scripts/install-playwright-ci.sh, saa de tre
        # workflows der bruger Playwright ikke driver fra hinanden. Loekken
        # der stod her, kunne per konstruktion ALDRIG lykkes efter en
        # timeout: `timeout` draeber kun wrapper'en, den efterladte apt-get
        # beholder /var/lib/apt/lists/lock, og de to resterende forsoeg
        # fejlede derfor oejeblikkeligt. Ramte fire koersler 19-08-2026,
        # inkl. produktions-deployet. Se scriptets hoved.
        run: bash scripts/install-playwright-ci.sh

      # Fanger 2026-07-19-fejlklassen (1101/1102 under samtidig trafik, straks
      # efter deploy) FOER den naar rigtige brugere ubemaerket.
      #
      # 2026-07-20: Cloudflares GRATIS Bot Fight Mode blokerede foerst denne
      # trins curl-requests (falsk alarm, koersel #73). Et forsoeg med en
      # WAF-skip-regel + delt hemmelighed (CI_BYPASS_SECRET) virkede ALDRIG,
      # fordi Bot Fight Mode (i modsaetning til Super Bot Fight Mode paa
      # Pro-planen+) ikke koerer paa WAF'ens Ruleset-motor og derfor ikke kan
      # skippes af nogen WAF-regel, uanset hvor korrekt den er konfigureret
      # (bekraeftet mod Cloudflares egen dokumentation). Erstattet med
      # scripts/smoke-test.mjs, som bruger en rigtig (headless) browser til
      # at loese JS-udfordringen i stedet for at forsoege at omgaa den.
      #
      # continue-on-error er bevidst IKKE fjernet endnu - Playwright-udgaven
      # er ikke bekraeftet ved en rigtig koersel mod produktionen endnu.
      # Fjern foerst naar en koersel har vist reelle 200'ere.
      - name: Roegtest af produktionen (samtidige requests)
        continue-on-error: true
        run: node scripts/smoke-test.mjs https://madshopper.dk

      - name: Relay ventende feedback til Google Sheet
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: pip install httpx && python scripts/relay-feedback-to-sheet.py
