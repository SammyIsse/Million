name: Scraper - Lidl (Tjek API)

on:
  # Startes kl. 00:01 dansk tid af nightly-dispatcher.yml (sommer-/vintertid håndteres dér)
  workflow_dispatch:

# Forhindrer at en manuel genkørsel af DENNE scraper overlapper sin egen
# planlagte kørsel - to samtidige kørsler kunne race på samme
# __staging__{butik}-navn i produkter-tabellen (se scraper/supabase_utils.py)
# eller dobbelt-skrive. Kun scoped til denne scraper, ikke andre butikker.
concurrency:
  group: scraper-lidl
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installér dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kør Lidl tilbudsavis scraper
        # SCRAPER_EMAIL/SCRAPER_PASSWORD i stedet for service_role
        # (compliance-audit 19-08-2026, GDPR-030, verificeret 24-08-2026 mod
        # Netto-scraperen): scraper/supabase_utils.py logger ind som en
        # dedikeret Supabase Auth-bruger, hvis adgang til produkter er
        # begrænset af RLS (scripts/supabase-scraper-account.sql) - i stedet
        # for en nøgle der kan læse ALT, inkl. auth.users og
        # price_alerts.email. Den offentlige nøgle her er samme værdi som i
        # wrangler.toml/build-pages.sh - sikker at committe, den styrer ikke
        # selve adgangen (det gør RLS-policyen).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jt8N0XezmzfZJSzzSwBBKQ_uGbNoq8f
          SCRAPER_EMAIL: ${{ secrets.SCRAPER_EMAIL }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
        run: python scraper/webscrape_lidl.py
