name: Upload Canary Version (no traffic)

# Bygger og uploader en ny Worker-version til Cloudflare UDEN at flytte
# nogen trafik til den - "wrangler versions upload" (i modsætning til
# "wrangler deploy", som deploy-edge.yml bruger) opretter kun en inaktiv
# version. Trafik til den styres bagefter manuelt i Cloudflare-dashboardet
# via "Split versions" (Deployments-fanen > "..." på versionen > Split
# versions), hvor man kan sætte fx 5% og skrue til 0% igen uden nedetid.
#
# Kun manuel start (workflow_dispatch) - ingen push-trigger, saa denne
# rører aldrig den normale deploy-pipeline eller produktionstrafikken
# automatisk.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Kort besked til version-historikken (valgfri)'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Edge bundle
        env:
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: bash scripts/build-pages.sh

      # Pin wrangler 4.x: wrangler-action@v3 falder ellers tilbage til 3.90.0
      # når npx mangler --yes til 4.x, og 3.90 parser Python-workers som JS
      # ("Uncaught SyntaxError: Unexpected string" i _edgekit_entrypoint.py).
      # Python versions-upload kræver wrangler ≥ den fix der landede i #9626.
      # Saniter beskeden FOER den naar en kommandolinje. `inputs.message` blev
      # tidligere interpoleret direkte ind i `command:` i et trin hvor
      # CLOUDFLARE_API_TOKEN staar i miljoeet - en besked som
      # `"; curl ...$CLOUDFLARE_API_TOKEN; #` ville altsaa koere. Det kraever
      # write-adgang til repoet, saa det er en eskaleringsvej fra "maa pushe"
      # til "kan eksfiltrere Cloudflare-token", ikke et eksternt angreb - men
      # de oevrige workflows (nightly-dispatcher.yml, recipe-import.yml) goer
      # det allerede rigtigt via env:, saa denne skilte sig ud.
      - name: Rens versionsbesked
        id: msg
        env:
          RAW_MESSAGE: ${{ inputs.message }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$RAW_MESSAGE" ]; then
            clean="canary-$RUN_ID"
          else
            # Kun bogstaver, tal, mellemrum og - _ . / : overlever. Maks 120 tegn.
            clean=$(printf '%s' "$RAW_MESSAGE" | tr -cd 'A-Za-z0-9 ._/:-' | cut -c1-120)
            [ -z "$clean" ] && clean="canary-$RUN_ID"
          fi
          echo "clean=$clean" >> "$GITHUB_OUTPUT"

      - name: Upload version (0% trafik)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: versions upload --message "${{ steps.msg.outputs.clean }}"
          workingDirectory: dist
