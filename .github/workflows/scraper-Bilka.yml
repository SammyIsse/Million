name: Scraper - Bilka

on:
  # Startes kl. 00:01 dansk tid af nightly-dispatcher.yml (sommer-/vintertid håndteres dér)
  workflow_dispatch:

# Forhindrer at en manuel genkørsel af DENNE scraper overlapper sin egen
# planlagte kørsel - to samtidige kørsler kunne race på samme
# __staging__{butik}-navn i produkter-tabellen (se scraper/supabase_utils.py)
# eller dobbelt-skrive. Kun scoped til denne scraper, ikke andre butikker.
concurrency:
  group: scraper-bilka
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installér dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kør Bilka katalog scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEPLOY_KEY }}
        run: python scraper/bilka_katalog.py
