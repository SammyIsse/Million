name: Update Product Cache

on:
  # Startes kl. 01:00 dansk tid af nightly-dispatcher.yml (sommer-/vintertid
  # håndteres dér). Scraperne er typisk færdige 00:10, så der er ~50 min margin.
  #
  # Her stod foer, at den "normalt" blev trigget ~00:20 af
  # trigger-cache-updater.yml naar de tunge scrapere var faerdige. Den kaede har
  # vaeret doed siden 09-07-2026, hvor scraperne gik over til at blive
  # dispatchet af nightly-dispatcher med GITHUB_TOKEN - GitHub udloeser ikke
  # workflow_run for koersler skabt med det token. "Fallbacken" har vaeret den
  # eneste vej lige siden, og trigger-workflowet er fjernet.
  workflow_dispatch:
    inputs:
      staging_only:
        description: 'Kun madshopper-dev (seed dev-D1, rør ikke produktions-D1/cache)'
        type: boolean
        default: false
      force_reseed:
        description: 'Tving D1-reseed (ignorer 6t-spærre)'
        type: boolean
        default: false
  push:
    branches: [main, dev]
    paths:
      - 'updater.py'
      - 'app_support.py'
      - 'scraper/**'
      - 'data/rema_hashes.json'
      - '.github/workflows/cache-updater.yml'

# Deles med deploy-workflowet for SAMME miljø (madshopper-edge-production /
# -staging). En D1-tabelswap og en deploy med cache_version-bump + CDN-purge
# må ikke køre samtidigt: det er præcis "samtidige cold renders efter reseed",
# opskriften bag nedbruddet 2026-07-19. Gruppen er miljøopdelt, så et
# staging-seed ikke unødigt blokerer en produktions-deploy.
concurrency:
  group: madshopper-edge-${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Updateren genopbygger produktionens app_cache og skriver VARIG
      # prishistorik. Hverken app_cache eller price_history har en _dev-variant,
      # så den rammer produktionens data uanset DEPLOY_ENV - og gør det med
      # DEPLOY_KEY. Et push til dev må derfor ikke køre den: et umerget
      # matching-eksperiment ville ellers ændre hvad rigtige besøgende ser,
      # før nogen har set på det, og price_history selvheler ikke.
      # Dev-pushet re-seeder stadig dev-D1 nedenfor, så staging får den nye kode
      # - blot mod det app_cache som main sidst byggede. Skal en matching-
      # ændring måles, køres updateren bevidst fra main (eller lokalt).
      - name: Run updater script
        if: ${{ github.ref != 'refs/heads/dev' && !inputs.staging_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python updater.py

      # Skriver opskrifternes pris-snapshot til produktionens tabel - samme
      # begrundelse som updater-steppet ovenfor.
      - name: Genberegn opskrift-priser
        if: ${{ github.ref != 'refs/heads/dev' && !inputs.staging_only }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: python recipe_pricing.py

      - name: Re-seed D1 database
        id: seed
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ (github.ref == 'refs/heads/dev' || inputs.staging_only) && 'staging' || '' }}
          # Push til matching-/kategori-kode (updater/app_support) skal altid
          # reseed'e - ellers serverer edge stadig gamle produktkort inden for
          # 6t-spærren (skete 2026-07-26 med Toms slik↔is).
          FORCE_RESEED: ${{ (github.event_name == 'push' || inputs.force_reseed) && '1' || '' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            python scripts/seed-d1.py
          else
            echo "CLOUDFLARE_API_TOKEN/ACCOUNT_ID ikke sat - springer D1 re-seed over"
          fi

      # ---------------------------------------------------------------
      # Zone-CDN'en er et SELVSTÆNDIGT lag foran worker'en. cache_version
      # versionerer kun Workers Cache API; zonen cacher HTML i 24 timer på den
      # rå URL uden __cv og blev kun purget ved DEPLOY. En URL der landede i
      # zone-cachen kl. 23 serverede derfor gårsdagens priser til kl. 23 næste
      # dag - uden at worker'en overhovedet blev kaldt, og med grøn CI.
      #
      # Purge er dog IKKE gratis: den gør alle sider kolde på én gang, og
      # mange samtidige cold renders er præcis mekanikken bag nedbruddet
      # 2026-07-19. Derfor tre ting: kun efter en seed der FAKTISK lykkedes,
      # kun i produktion, og altid efterfulgt af sekventiel opvarmning.
      # Tidspunktet (~01:00) er samtidig døgnets laveste trafik, så en kort
      # kold periode rammer færrest muligt.
      - name: Purge zone-CDN efter seed
        if: ${{ steps.seed.outcome == 'success' && github.ref != 'refs/heads/dev' && !inputs.staging_only }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Zone-ID/token ikke sat - CDN beholder op til 24t gamle priser"
            exit 0
          fi
          code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || echo 000)
          echo "CDN purge HTTP ${code}"
          cat /tmp/purge.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::CDN-purge svarede $code - forsiden kan viser gamle priser indtil i morgen"
          fi

      # Der er IKKE et opvarmningstrin her - se kommentaren nedenfor. Det
      # tidligere trin (scripts/warm-edge-cache.mjs via Playwright) blev
      # fjernet 2026-08, fordi det MÅLTE at fejle 14/14 nætter siden mindst
      # 2026-07-27 (Cloudflares Bot Fight Mode blokerer ubetinget fra GitHub
      # Actions-IP'er) - continue-on-error skjulte fejlen i over en uge og
      # brugte CI-minutter på et trin der aldrig kunne lykkes. Opvarmning
      # sker nu udelukkende server-side i src/worker.py (_queue_background_warm).

      - name: Opdater hjemmesidens cache
        if: ${{ github.ref != 'refs/heads/dev' && !inputs.staging_only }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
        run: |
          if [ -n "$APP_URL" ] && [ -n "$CACHE_REFRESH_SECRET" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "${APP_URL%/}/api/refresh-cache" \
              -H "X-Cache-Secret: $CACHE_REFRESH_SECRET" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Edge-cache nulstillet (HTTP 200)"
            else
              # Ikke-kritisk: D1-seed + cache_version har allerede opdateret data
              # på edge. Vi fejler ikke hele pipelinen på et cache-ping.
              echo "advarsel: /api/refresh-cache svarede HTTP $code - ikke kritisk (D1-seed har allerede opdateret data)"
            fi
          else
            echo "APP_URL eller CACHE_REFRESH_SECRET ikke sat - hjemmesiden henter nye data ved første besøg næste dag"
          fi

      # Seed-steppet ovenfor har continue-on-error, så efterfølgende steps
      # (cache-refresh mv.) stadig kan køre selv om D1-reseed fejlede. Uden
      # DETTE step ville en fejlet seed derfor give en HELT GRØN workflow-
      # kørsel - ingen mail, ingen alarm, og D1/cache_version står på
      # gårsdagens data indtil nogen tilfældigt opdager det. Dette step
      # fejler jobbet eksplicit, så GitHubs "scheduled workflow failed"-mail
      # (samme alarmkanal som uptime-check.yml) rent faktisk sendes.
      - name: Fail jobbet hvis D1-reseed fejlede
        if: ${{ steps.seed.outcome == 'failure' }}
        run: |
          echo "::error::D1-reseed fejlede - se 'Re-seed D1 database'-trinnet ovenfor. D1/cache_version er IKKE opdateret."
          exit 1

      # seed-d1 bumper cache_version → alle sider kolde. Der er IKKE et
      # opvarmningstrin her længere: målt (2026-08-03) at det fejlede 14/14
      # HVER nat siden mindst 2026-07-27 - Cloudflares gratis Bot Fight Mode
      # blokerer ALT fra GitHub Actions-IP'er ubetinget og kan ikke skippes
      # af nogen WAF-regel (se kommentar i deploy-edge.yml). continue-on-error
      # skjulte fejlen i over en uge og forklarer de tilbagevendende
      # 1101-nedbrud. Opvarmning sker nu server-side i src/worker.py
      # (_queue_background_warm) - Workeren varmer sig selv via interne kald,
      # der aldrig rammer Cloudflares edge og derfor aldrig kan Bot Fight-
      # blokeres.
