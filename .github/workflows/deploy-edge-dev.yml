name: Deploy Edge Worker (staging)

# Samme flow som deploy-edge.yml, men til madshopper-dev (egen KV/D1,
# dev.madshopper.dk) i stedet for produktion - så features kan testes på en
# rigtig edge-deployment uden at røre madshopper.dk.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'app.py'
      - 'app_support.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'pyproject.toml'
      - 'scripts/build-pages.sh'
      - 'scripts/smoke-test.mjs'
      - 'scripts/warm-edge-cache.mjs'
      - '.github/workflows/deploy-edge-dev.yml'
      # Indgår i bundtet/afhængigheds-opløsningen - uden dem her kunne en
      # ændring ligge udeployeret uden at nogen så det.
      - '_routes.json'
      - 'uv.lock'

# Se begrundelsen i deploy-edge.yml. Samme gruppe som cache-updater bruger for
# dev, så et staging-seed og en staging-deploy ikke kan overlappe.
concurrency:
  group: madshopper-edge-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_ENV: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Edge bundle
        env:
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
          # Uden denne byggede staging med tom webhook-URL, saa feedback afgivet
          # paa dev aldrig kunne naa Google Sheet (samme var som i deploy-edge.yml).
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          # Adgangsspaerring paa staging. madshopper-dev koerer den samme kode
          # mod SAMME Supabase-projekt og samme auth.users som produktionen, men
          # paa et offentligt custom domain. Uden denne er hele fladen aaben for
          # enhver der gaetter adressen. Er secret'en ikke sat, genererer
          # build-pages.sh en tilfaeldig ved hvert build - saa skifter
          # adgangsnoeglen ved hvert deploy (spaerringen virker stadig).
          STAGING_ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_SECRET }}
          # Mail+adgangskode-login paa /staging-login (se src/worker.py) -
          # venligere for et menneske end nøglen ovenfor. Samme fail-closed
          # opførsel hvis en af dem mangler: login-siden falder tilbage til
          # 404, kun ?k=-nøglen virker så.
          STAGING_ACCESS_EMAIL: ${{ secrets.STAGING_ACCESS_EMAIL }}
          STAGING_ACCESS_PASSWORD: ${{ secrets.STAGING_ACCESS_PASSWORD }}
        run: bash scripts/build-pages.sh

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: deploy
          workingDirectory: dist

      - name: Nulstil edge-cache (cache_version)
        working-directory: dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler 4 default'er til lokal KV - uden --remote bumpes
          # cache_version aldrig i Cloudflare, så edge-cachen invalideres ikke.
          npx --yes wrangler@4.114.0 kv key put cache_version "$(date +%s)" \
            --namespace-id b879e69c3a1f477c9c69bbc7e7b041df \
            --remote

      # Samme roegtest som produktionens deploy-edge.yml, men mod staging - saa
      # 2026-07-19-fejlklassen (1101/1102 under samtidig trafik) fanges HER,
      # inden koden overhovedet naar main. Staging afsloerede intet dengang,
      # netop fordi ingen belastede den med samtidige requests.
      #
      # Bruger scripts/smoke-test.mjs (Playwright/headless browser) i stedet
      # for curl - se deploy-edge.yml for hvorfor curl+WAF-skip-regel aldrig
      # kunne virke mod Cloudflares gratis Bot Fight Mode.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium)
        run: |
          npm install playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Opvarm edge-cache (sekventielt)
        # Samme Bot Fight-begrænsning som produktion - må ikke fejle hele deployet.
        continue-on-error: true
        env:
          STAGING_ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_SECRET }}
        run: node scripts/warm-edge-cache.mjs https://dev.madshopper.dk "$STAGING_ACCESS_SECRET"

      # Free-planens CPU-budget er opbrugt efter deploy + 14-stiers warmup.
      # Uden pause her starter røgtesten midt i et "forgiftet" isolate og
      # fejler fra runde 2 (målt 2026-07-26: 0→28 fejl; efter pause + mildere
      # smoke er gaten stadig hård nok til at fange 1101-klassen).
      - name: Vent på CPU-budget efter warmup
        run: sleep 45

      - name: Roegtest af staging (samtidige requests)
        # Adgangsnoeglen sendes med: staging er spaerret og svarer 404 uden den,
        # saa uden dette ville roegtesten maale sin egen spaerring i stedet for
        # sitet. Noeglen bruges kun paa warmup-navigationen, som saetter en
        # cookie resten af koerslen genbruger. GitHub maskerer den i loggen.
        #
        # Mildere end prod-defaults: staging har næsten ingen organisk cache-
        # varme og deler free-planens CPU med warmup lige før. 2 runder med
        # længere pause fanger stadig samtidige 500'ere uden selv at vælte.
        env:
          STAGING_ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_SECRET }}
          SMOKE_ROUNDS: "2"
          SMOKE_PER_ROUND: "8"
          SMOKE_ROUND_PAUSE_MS: "30000"
          SMOKE_TOLERANCE: "2"
        run: node scripts/smoke-test.mjs https://dev.madshopper.dk "$STAGING_ACCESS_SECRET"
