name: Recipe Import & Moderation

# Kører recipe_importer.py (opskrift-import fra URL + genmatch af bruger-
# indsendte opskrifter, se docs/Features.md). Ingen AI/Ollama involveret -
# se recipe_importer.py's moduldokumentation for hvorfor.

on:
  schedule:
    # Kl. ~05:00 dansk tid (UTC+1/+2) - efter nattens cache-updater (01:00),
    # så matching kører mod frisk produktdata. Ingen sommer-/vintertids-
    # præcision nødvendig her (modsat nightly-dispatcher.yml) - en times
    # forskydning to gange om året er ligegyldigt for en moderations-kø.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Opskrift-URL til admin-import (tom = kør moderation af ventende bruger-opskrifter)'
        type: string
        default: ''

concurrency:
  group: recipe-import
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recipe-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kør opskrift-import/-moderation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RECIPE_URL: ${{ inputs.url }}
        run: |
          if [ -n "$RECIPE_URL" ]; then
            python recipe_importer.py "$RECIPE_URL"
          else
            python recipe_importer.py moderate
          fi
